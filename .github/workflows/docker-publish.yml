name: Docker Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    # The arm64 leg is emulated, so it is the slow one; a healthy build of the
    # whole matrix finishes in under three minutes. 30 minutes is generous for a
    # cold cache and still turns a stalled build into a failure in half an hour
    # rather than idling out GitHub's 360-minute default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - path: services/auth-service
            name: auth-service
          - path: services/post-service
            name: post-service
          - path: services/user-service
            name: user-service
          - path: services/api-gateway
            name: api-gateway
          - path: social-media-mini-frontend
            name: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Required for the linux/arm64 leg: it registers the current
      # tonistiigi/binfmt QEMU rather than leaving the build to whatever
      # emulation the runner image happens to ship. The older runner-provided
      # QEMU intermittently died with
      #   qemu: uncaught target signal 4 (Illegal instruction) - core dumped
      # inside `npm install`, after which BuildKit stopped producing output and
      # the job hung until it was cancelled.
      # Must come before Buildx, which captures the available platforms when it
      # creates the builder.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
